native_wide = false
# Fully 3D with no sprite_tag_funcs helper. Without this no frame is classified
# as gameplay and everything pillarboxes 4:3. 2D screens still present 4:3.
gte_game_mode = true

[controller]
default_mode = "digital"
multitap_analog = true

